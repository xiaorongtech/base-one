<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Komuta Free Edge · 出口节点</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1120;
    --panel: rgba(17, 25, 44, .78);
    --line: rgba(148, 163, 184, .22);
    --fg: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-ink: #06263a;
    --ok: #34d399;
    --err: #f87171;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--fg);
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(56, 189, 248, .16), transparent 60%),
      radial-gradient(700px 500px at 92% 110%, rgba(52, 211, 153, .12), transparent 60%),
      var(--bg);
  }
  main {
    width: min(94vw, 720px);
    padding: 2.25rem;
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    background: var(--panel);
    backdrop-filter: blur(12px);
    box-shadow: 0 26px 70px rgba(2, 6, 23, .55);
  }
  .badge {
    display: inline-flex; align-items: center; gap: .5rem;
    padding: .3rem .7rem; border-radius: 999px;
    font-size: .78rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); background: rgba(56, 189, 248, .1);
    border: 1px solid rgba(56, 189, 248, .3);
  }
  .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(52, 211, 153, .18); }
  h1 { margin: 1rem 0 .35rem; font-size: clamp(1.6rem, 5vw, 2.3rem); letter-spacing: -.02em; }
  p.lede { margin: 0 0 1.75rem; color: var(--muted); line-height: 1.65; }
  dl {
    margin: 0 0 1.5rem; padding: 0;
    display: grid; grid-template-columns: 5.5rem 1fr; gap: .55rem 1rem;
  }
  dt { color: var(--muted); font-size: .9rem; }
  dd { margin: 0; font-family: var(--mono); font-size: .92rem; word-break: break-all; }
  .linkbox {
    display: flex; align-items: stretch; gap: .5rem; flex-wrap: wrap;
    margin-bottom: 1.1rem;
  }
  .linkbox code {
    flex: 1 1 20rem; padding: .8rem .9rem;
    border: 1px solid var(--line); border-radius: .7rem;
    background: rgba(2, 6, 23, .55);
    font-family: var(--mono); font-size: .84rem; line-height: 1.5;
    word-break: break-all; color: #bae6fd; max-height: 7rem; overflow: auto;
  }
  button {
    flex: 0 0 auto; padding: 0 1.2rem; border-radius: .7rem; cursor: pointer;
    border: 1px solid transparent; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 600; font-size: .9rem; transition: filter .15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; border-color: var(--line); color: var(--fg); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; }
  .hint { margin: 1.4rem 0 0; padding-top: 1.1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .86rem; line-height: 1.7; }
  code.inl { font-family: var(--mono); color: #bae6fd; }
  .err { color: var(--err); }
  .skel { color: var(--muted); font-family: var(--mono); }
</style>
</head>
<body>
<main>
  <span class="badge"><span class="dot"></span>Running</span>
  <h1>Komuta Free Edge</h1>
  <p class="lede">部署在 Komuta 德国东部免费 PaaS 上的 VLESS + WebSocket 出口节点，TLS 由平台边缘层终止。</p>

  <dl id="info">
    <dt>状态</dt><dd class="skel">读取中…</dd>
  </dl>

  <div class="linkbox">
    <code id="link">读取中…</code>
    <button id="copy" disabled>复制链接</button>
  </div>

  <div class="row">
    <button class="ghost" id="copyJson" disabled>复制参数 JSON</button>
    <button class="ghost" id="copyLink" disabled>复制 VLESS URI</button>
  </div>

  <p class="hint">
    在 v2rayN / Clash Verge / Shadowrocket 中导入上方链接即可；扫码请使用配套交付的 690×690 二维码图片。<br>
    节点参数由服务端运行时生成，原始凭据保存在平台密钥库中，不会出现在代码仓库内。
  </p>
</main>

<script>
(function () {
  var WS_PATH = "${WS_PATH}";
  var infoEl = document.getElementById("info");
  var linkEl = document.getElementById("link");
  var copyBtn = document.getElementById("copy");
  var copyJsonBtn = document.getElementById("copyJson");
  var copyLinkBtn = document.getElementById("copyLink");

  function setField(label, value) {
    var row = document.createElement("dt");
    row.textContent = label;
    var val = document.createElement("dd");
    val.textContent = value;
    infoEl.appendChild(row);
    infoEl.appendChild(val);
  }

  function render(node) {
    infoEl.innerHTML = "";
    var host = location.hostname;
    var query = "encryption=none&security=tls&sni=" + encodeURIComponent(host) +
                "&fp=chrome&type=ws&host=" + encodeURIComponent(host) +
                "&path=" + encodeURIComponent(node.path);
    var uri = "vless://" + node.uuid + "@" + host + ":" + node.port + "?" + query +
              "#" + encodeURIComponent(node.remark || "Komuta Free Edge");

    setField("状态", "运行中");
    setField("地址", host + ":" + node.port);
    setField("UUID", node.uuid);
    setField("路径", node.path);
    setField("传输", "WebSocket + TLS");
    setField("地域", "Germany-East");

    linkEl.textContent = uri;
    linkEl.title = uri;

    copyBtn.disabled = false;
    copyJsonBtn.disabled = false;
    copyLinkBtn.disabled = false;

    copyBtn.addEventListener("click", function () { copy(uri); });
    copyLinkBtn.addEventListener("click", function () { copy(uri); });
    copyJsonBtn.addEventListener("click", function () {
      copy(JSON.stringify({ uuid: node.uuid, host: host, port: node.port, path: node.path, tls: true, network: "ws" }, null, 2));
    });
  }

  function copy(text) {
    var done = function () {
      var old = copyBtn.textContent;
      copyBtn.textContent = "已复制";
      setTimeout(function () { copyBtn.textContent = old; }, 1400);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  fetch(WS_PATH + "/node.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      infoEl.innerHTML = "";
      setField("状态", "读取失败");
      linkEl.className = "err";
      linkEl.textContent = "无法读取节点参数：" + e.message;
    });
})();
</script>
</body>
</html>
